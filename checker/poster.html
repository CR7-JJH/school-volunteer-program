<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR 안내판 인쇄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --green: #1f8a5b;
      --green-soft: #e3f4eb;
      --orange: #d9822b;
      --ink: #1c2333;
      --muted: #5e6880;
      --code: #14211b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e9ecea;
      color: var(--ink);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      word-break: keep-all;
    }

    /* ---------- 설정 패널 (인쇄되지 않음) ---------- */
    .panel {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .panel h1 { margin: 0 0 4px; font-size: 22px; }
    .panel p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .panel label { display: block; margin: 16px 0 6px; font-weight: 700; font-size: 15px; }
    .panel textarea {
      width: 100%;
      min-height: 110px;
      padding: 10px 12px;
      border: 1px solid #c9d0cc;
      border-radius: 10px;
      font: inherit;
    }
    .panel .hint { margin: 6px 0 0; font-size: 13px; }
    .kinds { display: flex; flex-wrap: wrap; gap: 8px; }
    .kinds label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #c9d0cc;
      border-radius: 10px;
      background: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .kinds input { accent-color: var(--green); }
    .print-btn {
      margin-top: 20px;
      min-height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    /* ---------- 공통 인쇄물 ---------- */
    .pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 0 16px 48px; }
    .page {
      width: 210mm;
      height: 297mm;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    .qr svg { display: block; width: 100%; height: auto; }
    .if { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* A4 안내판 */
    .poster { display: flex; flex-direction: column; padding: 16mm 16mm 12mm; }
    .poster .top { text-align: center; }
    .poster .tag {
      display: inline-block;
      padding: 2mm 5mm;
      border-radius: 99px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 800;
      font-size: 13pt;
    }
    .poster h2 { margin: 5mm 0 1mm; font-size: 40pt; line-height: 1.15; }
    .poster .en { margin: 0; color: var(--muted); font-size: 14pt; }
    .flow { display: flex; flex-direction: column; align-items: center; gap: 2mm; margin: 8mm 0 6mm; }
    .step {
      display: grid;
      grid-template-columns: 26mm 1fr;
      align-items: center;
      width: 150mm;
      padding: 3.5mm 6mm;
      border: 0.8mm solid var(--green);
      border-radius: 5mm;
    }
    .step .if { color: var(--orange); font-weight: 800; font-size: 18pt; }
    .step b { display: block; font-size: 22pt; }
    .step span { color: var(--muted); font-size: 12pt; }
    .down { color: var(--green); font-size: 16pt; line-height: 1; }
    .ok {
      width: 150mm;
      padding: 4mm 6mm;
      border-radius: 5mm;
      background: var(--code);
      color: #d8f3e4;
      text-align: center;
      font-size: 22pt;
      font-weight: 800;
    }
    .ok .t { color: #9ece6a; }
    .scan { display: flex; align-items: center; gap: 8mm; margin-top: auto; padding: 6mm; border-radius: 5mm; background: var(--green-soft); }
    .scan .qr { width: 52mm; flex-shrink: 0; background: #fff; padding: 3mm; border-radius: 2mm; }
    .scan b { display: block; font-size: 22pt; line-height: 1.25; }
    .scan .en { margin-top: 2mm; font-size: 12pt; }
    .scan .url { margin-top: 3mm; color: var(--muted); font-size: 9pt; word-break: break-all; }
    .poster .foot { display: flex; justify-content: space-between; margin-top: 5mm; color: var(--muted); font-size: 9pt; }

    /* 스티커 (A4 한 장에 8개) */
    .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 4mm; padding: 10mm; }
    .sticker {
      display: flex;
      align-items: center;
      gap: 4mm;
      padding: 4mm;
      border: 0.4mm dashed #9aa5a0;
      border-radius: 3mm;
    }
    .sticker .body { flex: 1; min-width: 0; }
    .sticker .title { margin: 0 0 2mm; font-size: 12pt; font-weight: 800; color: var(--green); }
    .sticker ol { margin: 0; padding: 0; list-style: none; font-size: 11pt; line-height: 1.5; }
    .sticker ol .if { color: var(--orange); font-weight: 800; }
    .sticker .res { margin-top: 1.5mm; padding: 1mm 2mm; border-radius: 1.5mm; background: var(--code); color: #9ece6a; font-size: 10pt; font-weight: 800; display: inline-block; }
    .sticker .side { width: 26mm; flex-shrink: 0; text-align: center; font-size: 7.5pt; color: var(--muted); }
    .sticker .qr { margin-bottom: 1mm; }

    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .panel { display: none; }
      .pages { padding: 0; gap: 0; }
      .page { box-shadow: none; break-after: page; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <section class="panel">
    <h1>QR 안내판·스티커 인쇄</h1>
    <p>분리수거함마다 붙일 안내판과 투입구 옆 순서도 스티커를 만듭니다. 위치를 적으면 QR마다 위치가 기록되어, 어느 분리수거함에서 많이 찍었는지 알 수 있어요.</p>

    <label for="locations">분리수거함 위치 (한 줄에 하나)</label>
    <textarea id="locations">1학년 복도
2학년 복도</textarea>
    <p class="hint">비워두면 위치 없이 한 장만 만들어요. 영문·숫자로 짧게 써도 됩니다. (예: 1F-A)</p>

    <label>종류</label>
    <div class="kinds">
      <label><input type="radio" name="kind" value="poster" checked> A4 안내판 (위치별 1장)</label>
      <label><input type="radio" name="kind" value="sticker"> 순서도 스티커 (위치별 8개)</label>
    </div>

    <button class="print-btn" type="button" id="print">인쇄하기</button>
  </section>

  <div class="pages" id="pages"></div>

  <script src="config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script>
    (function () {
      'use strict';
      var CONFIG = window.CHECKER_CONFIG || {};
      var base = CONFIG.publicUrl || new URL('./', window.location.href).href;
      var pages = document.getElementById('pages');
      var textarea = document.getElementById('locations');

      function urlFor(loc) {
        return loc ? base + '?from=' + encodeURIComponent(loc) : base;
      }

      function qrSvg(text) {
        var qr = window.qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: '분리배출 판별 페이지 QR코드' });
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function poster(loc) {
        var url = urlFor(loc);
        return '' +
          '<section class="page poster">' +
            '<div class="top">' +
              '<span class="tag">분리배출 디버깅 프로젝트</span>' +
              '<h2>버리기 전 3초 if문</h2>' +
              '<p class="en">3-second check before you throw it away</p>' +
            '</div>' +
            '<div class="flow">' +
              '<div class="step"><span class="if">if ①</span><div><b>비웠나?</b><span>음료·음식물을 비웠나요? · Empty it</span></div></div>' +
              '<div class="down">▼</div>' +
              '<div class="step"><span class="if">if ②</span><div><b>헹궜나?</b><span>물로 한 번 헹궜나요? · Rinse it</span></div></div>' +
              '<div class="down">▼</div>' +
              '<div class="step"><span class="if">if ③</span><div><b>뗐나?</b><span>라벨·스티커·빨대를 뗐나요? · Remove labels</span></div></div>' +
              '<div class="down">▼</div>' +
              '<div class="ok if">→ 재활용 <span class="t">TRUE</span></div>' +
            '</div>' +
            '<div class="scan">' +
              '<div class="qr">' + qrSvg(url) + '</div>' +
              '<div>' +
                '<b>헷갈리면<br>QR 찍고 3초 판별!</b>' +
                '<p class="en">Not sure? Scan to check where it goes.</p>' +
                '<p class="url">' + esc(base) + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="foot"><span>대영고 R&amp;A 사회 참여 봉사</span><span>' + esc(loc || '') + '</span></div>' +
          '</section>';
      }

      function sticker(loc) {
        var url = urlFor(loc);
        var one = '' +
          '<div class="sticker">' +
            '<div class="body">' +
              '<p class="title">버리기 전 3초 if문</p>' +
              '<ol class="if-list">' +
                '<li><span class="if">if</span> 비웠나? <small>Empty</small></li>' +
                '<li><span class="if">if</span> 헹궜나? <small>Rinse</small></li>' +
                '<li><span class="if">if</span> 뗐나? <small>Remove</small></li>' +
              '</ol>' +
              '<span class="res if">→ 재활용 TRUE</span>' +
            '</div>' +
            '<div class="side"><div class="qr">' + qrSvg(url) + '</div>헷갈리면 QR</div>' +
          '</div>';
        var cells = '';
        for (var i = 0; i < 8; i++) cells += one;
        return '<section class="page sheet">' + cells + '</section>';
      }

      function render() {
        var locs = textarea.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        if (!locs.length) locs = [''];
        var kind = document.querySelector('input[name="kind"]:checked').value;
        pages.innerHTML = locs.map(kind === 'poster' ? poster : sticker).join('');
      }

      textarea.addEventListener('input', render);
      Array.prototype.forEach.call(document.querySelectorAll('input[name="kind"]'), function (r) {
        r.addEventListener('change', render);
      });
      document.getElementById('print').addEventListener('click', function () { window.print(); });
      render();
    })();
  </script>
</body>
</html>
